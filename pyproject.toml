[project]
name = "fitness-check"
version = "0.1.0"
description = ""
authors = [
    {name = "Anton Pugachev"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymysql (>=1.2.4,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.isort]
profile='black'
